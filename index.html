<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KKDN Kalbar 2026 — Portal Kunjungan</title>
<meta name="description" content="Portal Kunjungan Kerja Dalam Negeri Kedeputian Bidang Geoekonomi DPN ke Kalimantan Barat, 24–28 November 2026.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/leaflet/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <style>
    body{margin:0}
    :root{
      --color-bg:#f3f2f2;--color-surface:#eae9e9;--color-text:#201e1d;
      --color-accent:#ec3013;--color-divider:color-mix(in srgb,#201e1d 40%,transparent);
      --color-neutral-100:#f8f4f4;--color-neutral-200:#eae7e7;--color-neutral-300:#d7d3d3;
      --color-neutral-700:#605d5d;--color-neutral-800:#444141;
      --color-accent-100:#fff2ef;--color-accent-200:#ffe0d9;--color-accent-300:#ffc4b8;
      --color-accent-400:#ff9783;--color-accent-600:#dd2b0f;--color-accent-700:#ae1800;
      --color-orange:#f5860b;
      --font-heading:"Archivo",system-ui,sans-serif;--font-body:"Archivo",system-ui,sans-serif;
    }
    a{color:#ae1800}
    a:hover{color:#ec3013}
    button{font:inherit;color:inherit}
    :focus-visible{outline:2px solid #ec3013;outline-offset:2px}
    .kk-pin{background:#201e1d;color:#f3f2f2;border:2px solid #f3f2f2;font:800 11px/20px Archivo,system-ui,sans-serif;text-align:center;box-sizing:border-box;box-shadow:0 1px 3px rgba(0,0,0,.35)}
    .leaflet-container{font-family:Archivo,system-ui,sans-serif}
    .leaflet-popup-content-wrapper,.leaflet-popup-tip{border-radius:0}
    .kk-trace{stroke-dasharray:1000;stroke-dashoffset:0}
    @keyframes kkDraw{0%{stroke-dashoffset:1000}70%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}
    @keyframes kkRing{0%{transform:scale(.6);opacity:.95}100%{transform:scale(3.3);opacity:0}}
    @keyframes kkFlick{0%,100%{transform:scale(1,1)}25%{transform:scale(.94,1.08)}50%{transform:scale(1.05,.96)}75%{transform:scale(.97,1.05)}}
    @keyframes kkNow{0%{box-shadow:0 0 0 0 rgba(236,48,19,.55)}100%{box-shadow:0 0 0 12px rgba(236,48,19,0)}}
    .kk-ring{transform-box:fill-box;transform-origin:center;opacity:0}
    .kk-flame{transform-box:fill-box;transform-origin:50% 100%}
    @media (prefers-reduced-motion:no-preference){
      .kk-trace{animation:kkDraw 6s cubic-bezier(.4,0,.2,1) infinite}
      .kk-ring{animation:kkRing 2.4s ease-out infinite}
      .kk-r2{animation-delay:.8s}
      .kk-r3{animation-delay:1.6s}
      .kk-flame{animation:kkFlick 1.4s ease-in-out infinite}
      .kk-now{animation:kkNow 1.6s ease-out infinite}
    }
    .kk-tl-lbl{position:absolute;font-size:10px;line-height:1.2;letter-spacing:.04em;font-weight:700;white-space:nowrap;color:#605d5d}
    .kk-tl-num{position:absolute;transform:translateX(-50%);width:16px;height:16px;display:flex;align-items:center;justify-content:center;background:#201e1d;color:#f3f2f2;font:800 10px/1 Archivo,system-ui,sans-serif}
    .kk-tl-key{flex:0 0 16px;width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;background:#201e1d;color:#f3f2f2;font:800 10px/1 Archivo,system-ui,sans-serif}
    .kk-g2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:24px}
    .kk-kpi{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .kk-kab{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
    .kk-main{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px}
    .kk-ns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .kk-sas{columns:2;column-gap:32px}
    .kk-sas > *{break-inside:avoid}
    .kk-nav a{display:inline-flex;align-items:center;min-height:44px;white-space:nowrap}
    .kk-chip{display:inline-flex;align-items:center;min-height:32px;padding:0 10px;border:2px solid var(--color-divider);text-decoration:none;font-weight:700}
    html{-webkit-text-size-adjust:100%}
    img,svg{max-width:100%}
    @media (max-width:900px){
      .kk-g2,.kk-main{grid-template-columns:minmax(0,1fr)}
      .kk-kab{grid-template-columns:minmax(0,1fr)}
      .kk-side{border-left:none !important;padding-left:0 !important;border-top:2px solid var(--color-divider);padding-top:20px}
      .kk-sas{columns:1}
      .kk-h1{font-size:26px !important}
      .kk-sas a{display:inline-flex;align-items:center;min-height:44px}
      .kk-sas{line-height:1.35 !important}
      .kk-chip{min-height:44px}
    }
    @media (max-width:600px){
      .kk-wrap{padding:20px 16px 0 !important}
      header{padding:8px 16px !important}
      .kk-mapbox{min-height:320px !important}
      .kk-h1{font-size:24px !important}
      .kk-kpi > div{padding:10px !important}
      .kk-ns{grid-template-columns:minmax(0,1fr)}
      .kk-stats{display:grid !important;grid-template-columns:repeat(2,minmax(0,1fr))}
      .kk-pulse{flex-wrap:wrap}
      .kk-pulse > .kk-tl{flex-basis:100% !important}
      .kk-nav{display:grid !important;grid-template-columns:repeat(2,minmax(0,1fr));width:100%;gap:0 12px !important}
      .kk-hdr-meta{white-space:normal !important;margin-left:0 !important;padding-bottom:6px}
      .kk-kpi-v{font-size:19px !important}
    }
  </style>
</head>
<body>
<div id="app"></div>
<noscript><p style="font-family:system-ui,sans-serif;padding:24px">Portal ini membutuhkan JavaScript. Aktifkan JavaScript di browser Anda untuk melihat isinya.</p></noscript>
<template id="tpl">
<div style="background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);min-height:100vh;padding-bottom:48px">

  <header style="display:flex;align-items:center;flex-wrap:wrap;gap:6px 20px;min-height:56px;padding:8px 24px;box-sizing:border-box;border-bottom:2px solid var(--color-divider)">
    <div style="font-family:var(--font-heading);font-weight:800;font-size:14px;letter-spacing:.02em;white-space:nowrap">KKDN KALBAR 2026</div>
    <nav class="kk-nav" aria-label="Bagian halaman" style="display:flex;gap:0 16px;flex-wrap:wrap;font-size:12px;font-weight:700">
      <a href="#konteks">Konteks Kalbar</a>
      <a href="#pointer">Pointer diskusi</a>
      <a href="forum-diskusi-karhutla.html">Forum karhutla</a>
      <a href="#rundown">Rencana kegiatan</a>
    </nav>
    <div class="kk-hdr-meta" style="margin-left:auto;font-size:12px;color:var(--color-neutral-700);letter-spacing:.02em;white-space:nowrap">24–28 NOV / PONTIANAK · KUBU RAYA · MEMPAWAH</div>
  </header>

  <div class="kk-wrap" style="max-width:1200px;margin:0 auto;padding:28px 24px 0;box-sizing:border-box">

    <section aria-labelledby="judul" style="margin-bottom:24px">
      <div style="display:inline-flex;align-items:baseline;gap:10px;flex-wrap:wrap;background:var(--color-text);color:var(--color-bg);padding:8px 14px;margin-bottom:14px">
        <span style="font-family:var(--font-heading);font-weight:800;font-size:18px;letter-spacing:.02em">{{ dayBannerTitle }}</span>
        <span style="font-size:12px;letter-spacing:.04em;opacity:.85">{{ dayBannerSub }}</span>
      </div>
      <div style="font-size:11px;letter-spacing:.08em;color:var(--color-accent-700);font-weight:700;margin-bottom:6px">KUNJUNGAN KERJA DALAM NEGERI · KEDEPUTIAN BIDANG GEOEKONOMI DPN · PROVINSI KALIMANTAN BARAT</div>
      <h1 id="judul" class="kk-h1" style="font-family:var(--font-heading);font-size:34px;line-height:1.12;margin:0 0 10px;font-weight:800;max-width:940px">Kalimantan Barat: Karhutla, Hilirisasi &amp; Ketahanan Listrik di Wilayah Perbatasan</h1>
      <p style="margin:0;font-size:15px;line-height:1.5;color:var(--color-neutral-800);max-width:860px">Pontianak, Kubu Raya dan Mempawah, 24–28 November 2026, dengan tema “Strategi Penguatan Integrasi OMSP TNI dan Kolaborasi Lintas Sektor dalam Mitigasi, Penanggulangan dan Pemulihan Karhutla”. Kunjungan dimulai sembilan hari setelah status siaga darurat bencana asap Kalbar berakhir pada 15 November.</p>

      <div class="kk-pulse" role="img" aria-label="Lini masa Kalimantan Barat 2026: siaga darurat bencana asap 2 Februari sampai 15 November, pemadaman bergilir 2 sampai 12 Juli, rapat Presiden di Lanud Supadio 22 Agustus, pemeliharaan PLTU Bengkayang mulai Oktober, kunjungan KKDN 24 sampai 28 November" style="display:flex;align-items:center;gap:20px;margin-top:18px;padding:12px 0;border-top:2px solid var(--color-divider);border-bottom:2px solid var(--color-divider)">
        <div style="flex:0 0 auto;display:flex;align-items:center;gap:10px">
          <svg viewBox="-50 -50 100 100" width="76" height="76" aria-hidden="true" style="display:block;overflow:visible">
            <circle class="kk-ring" r="14" fill="none" stroke="#ec3013" stroke-width="2.5"></circle>
            <circle class="kk-ring kk-r2" r="14" fill="none" stroke="#ec3013" stroke-width="2.5"></circle>
            <circle class="kk-ring kk-r3" r="14" fill="none" stroke="#ec3013" stroke-width="2.5"></circle>
            <g class="kk-flame">
              <path d="M0,-17 C7,-9 12,-2 10,6 C8,13 -8,13 -10,6 C-12,-1 -5,-6 0,-17 Z" fill="#ec3013" stroke="#201e1d" stroke-width="1.5"></path>
              <path d="M0,-4 C4,0 6,4 5,7 C4,10 -4,10 -5,7 C-6,4 -3,1 0,-4 Z" fill="#f5860b"></path>
            </g>
          </svg>
          <div style="line-height:1.25">
            <div style="font-family:var(--font-heading);font-weight:800;font-size:20px;color:#ae1800">48.536 ha</div>
            <div style="font-size:10.5px;letter-spacing:.04em;color:var(--color-neutral-700)">LUAS KARHUTLA KALBAR 2026<br>BNPB · PER SEPTEMBER</div>
          </div>
        </div>
        <div class="kk-tl" style="flex:1 1 auto;min-width:0">
          <div style="position:relative;height:60px">
          <span class="kk-tl-num" aria-hidden="true" style="left:8.8%;top:0;background:#ae1800;color:#ffffff">1</span>
          <span class="kk-tl-num" aria-hidden="true" style="left:51.2%;top:0">2</span>
          <span class="kk-tl-num" aria-hidden="true" style="left:63.8%;top:0">3</span>
          <span class="kk-tl-num" aria-hidden="true" style="left:74.8%;top:0">4</span>
          <span class="kk-tl-num" aria-hidden="true" style="left:90.1%;top:0;background:#f5860b;color:#201e1d">5</span>
          <svg viewBox="0 0 1000 24" preserveAspectRatio="none" aria-hidden="true" style="position:absolute;left:0;top:20px;width:100%;height:24px;display:block">
            <line x1="0" y1="12" x2="1000" y2="12" stroke="#d7d3d3" stroke-width="2" vector-effect="non-scaling-stroke"></line>
            <line x1="0" y1="7" x2="0" y2="17" stroke="#d7d3d3" stroke-width="1" vector-effect="non-scaling-stroke"></line>
            <line x1="85" y1="8" x2="85" y2="16" stroke="#d7d3d3" stroke-width="1" vector-effect="non-scaling-stroke"></line>
            <line x1="162" y1="8" x2="162" y2="16" stroke="#d7d3d3" stroke-width="1" vector-effect="non-scaling-stroke"></line>
            <line x1="247" y1="8" x2="247" y2="16" stroke="#d7d3d3" stroke-width="1" vector-effect="non-scaling-stroke"></line>
            <line x1="329" y1="8" x2="329" y2="16" stroke="#d7d3d3" stroke-width="1" vector-effect="non-scaling-stroke"></line>
            <line x1="414" y1="8" x2="414" y2="16" stroke="#d7d3d3" stroke-width="1" vector-effect="non-scaling-stroke"></line>
            <line x1="496" y1="8" x2="496" y2="16" stroke="#d7d3d3" stroke-width="1" vector-effect="non-scaling-stroke"></line>
            <line x1="581" y1="8" x2="581" y2="16" stroke="#d7d3d3" stroke-width="1" vector-effect="non-scaling-stroke"></line>
            <line x1="666" y1="8" x2="666" y2="16" stroke="#d7d3d3" stroke-width="1" vector-effect="non-scaling-stroke"></line>
            <line x1="748" y1="8" x2="748" y2="16" stroke="#d7d3d3" stroke-width="1" vector-effect="non-scaling-stroke"></line>
            <line x1="833" y1="8" x2="833" y2="16" stroke="#d7d3d3" stroke-width="1" vector-effect="non-scaling-stroke"></line>
            <line x1="915" y1="8" x2="915" y2="16" stroke="#d7d3d3" stroke-width="1" vector-effect="non-scaling-stroke"></line>
            <line x1="1000" y1="7" x2="1000" y2="17" stroke="#d7d3d3" stroke-width="1" vector-effect="non-scaling-stroke"></line>
            <path d="M88,12 L871,12" fill="none" stroke="#ffc4b8" stroke-width="8" vector-effect="non-scaling-stroke"></path>
            <path class="kk-trace" pathLength="1000" d="M88,12 L871,12" fill="none" stroke="#ec3013" stroke-width="8" vector-effect="non-scaling-stroke"></path>
          </svg>
          <span aria-hidden="true" style="position:absolute;left:49.9%;width:2.7%;min-width:4px;top:27px;height:10px;background:#201e1d"></span>
          <span aria-hidden="true" style="position:absolute;left:63.8%;top:27px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:#201e1d;border:2px solid #f3f2f2;box-sizing:border-box"></span>
          <span aria-hidden="true" style="position:absolute;left:74.8%;top:27px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:#201e1d;border:2px solid #f3f2f2;box-sizing:border-box"></span>
          <span class="kk-now" aria-hidden="true" style="position:absolute;left:89.6%;top:24px;width:1.1%;min-width:10px;height:16px;background:#f5860b;border:2px solid #201e1d;box-sizing:border-box"></span>
          <sc-for list="{{ monthLabels }}" as="m" hint-placeholder-count="12">
            <span class="kk-tl-lbl" aria-hidden="true" style="{{ m.style }}">{{ m.label }}</span>
          </sc-for>
          </div>
          <ol aria-hidden="true" style="list-style:none;margin:8px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px 16px;font-size:10.5px;line-height:1.3;letter-spacing:.03em;font-weight:700;color:#605d5d">
            <li style="display:inline-flex;align-items:center;gap:6px"><span class="kk-tl-key" style="background:#ae1800;color:#ffffff">1</span><span style="color:#ae1800">2 FEB–15 NOV · SIAGA DARURAT ASAP</span></li>
            <li style="display:inline-flex;align-items:center;gap:6px"><span class="kk-tl-key">2</span><span>2–12 JUL · PEMADAMAN BERGILIR</span></li>
            <li style="display:inline-flex;align-items:center;gap:6px"><span class="kk-tl-key">3</span><span>22 AGU · RAPAT PRESIDEN DI SUPADIO</span></li>
            <li style="display:inline-flex;align-items:center;gap:6px"><span class="kk-tl-key">4</span><span>OKT · PLTU BENGKAYANG DIPELIHARA</span></li>
            <li style="display:inline-flex;align-items:center;gap:6px"><span class="kk-tl-key" style="background:#f5860b;color:#201e1d">5</span><span style="color:#201e1d;font-weight:800">24–28 NOV · KKDN</span></li>
          </ol>
        </div>
      </div>

      <div class="kk-stats" style="display:flex;gap:10px;margin-top:20px;flex-wrap:wrap">
        <div style="border:2px solid var(--color-text);padding:8px 14px;min-width:96px">
          <div style="font-size:20px;font-weight:800;font-family:var(--font-heading)">12</div>
          <div style="font-size:10px;color:var(--color-neutral-700);letter-spacing:.04em">SASARAN KUNJUNGAN</div>
        </div>
        <div style="border:2px solid var(--color-text);padding:8px 14px;min-width:96px">
          <div style="font-size:20px;font-weight:800;font-family:var(--font-heading)">5</div>
          <div style="font-size:10px;color:var(--color-neutral-700);letter-spacing:.04em">HARI KEGIATAN</div>
        </div>
        <div style="border:2px solid var(--color-text);padding:8px 14px;min-width:96px">
          <div style="font-size:20px;font-weight:800;font-family:var(--font-heading)">3</div>
          <div style="font-size:10px;color:var(--color-neutral-700);letter-spacing:.04em">MATRA TNI DIKUNJUNGI</div>
        </div>
        <div style="border:2px solid var(--color-text);padding:8px 14px;min-width:96px">
          <div style="font-size:20px;font-weight:800;font-family:var(--font-heading)">1</div>
          <div style="font-size:10px;color:var(--color-neutral-700);letter-spacing:.04em">FORUM DISKUSI KARHUTLA</div>
        </div>
        <div style="border:2px solid var(--color-accent);background:var(--color-accent-100);padding:8px 14px;min-width:96px">
          <div style="font-size:20px;font-weight:800;font-family:var(--font-heading);color:var(--color-accent-700)">{{ countdownValue }}</div>
          <div style="font-size:10px;color:var(--color-accent-700);letter-spacing:.04em">{{ countdownLabel }}</div>
        </div>
      </div>
    </section>

    <div style="height:2px;background:var(--color-divider);margin-bottom:24px"></div>

    <section id="konteks" aria-labelledby="konteks-h" style="margin-bottom:28px">
      <div style="font-size:11px;letter-spacing:.08em;color:var(--color-accent-700);font-weight:700;margin-bottom:4px">KONTEKS KUNJUNGAN · DATA S.D. 20 NOVEMBER 2026</div>
      <h2 id="konteks-h" style="font-family:var(--font-heading);font-size:22px;margin:0 0 8px;font-weight:800">Kalbar 2026: Asap, Listrik dan Hilirisasi</h2>
      <p style="margin:0 0 18px;font-size:14px;line-height:1.55;color:var(--color-neutral-800);max-width:860px">Kalbar berbatasan darat dengan Sarawak dan menjadi provinsi dengan karhutla terluas di Indonesia pada 2026. Sistem listriknya dua kali padam bergilir, sementara Mempawah menjadi lokasi hilirisasi bauksit–alumina–aluminium terbesar milik BUMN. Tiga topik audiensi Gubernur di rundown (karhutla, hilirisasi, listrik) adalah tiga isu terbesar provinsi saat ini.</p>

      <div class="kk-g2" style="align-items:stretch">
        <div style="display:flex;flex-direction:column">
          <div ref="{{ mapRef }}" class="kk-mapbox" role="region" aria-label="Peta OpenStreetMap lokasi kunjungan KKDN Kalbar; gunakan tombol + dan − untuk zoom" style="flex:1 1 auto;min-height:440px;border:2px solid var(--color-divider);background:#eae7e7"></div>
          <div style="display:flex;flex-wrap:wrap;gap:6px 16px;font-size:11.5px;color:var(--color-neutral-800);margin-top:10px">
            <span style="display:inline-flex;align-items:center;gap:6px"><span style="width:14px;height:14px;background:#201e1d;display:inline-block"></span>Nomor sasaran (klik untuk detail)</span>
            <span style="display:inline-flex;align-items:center;gap:6px"><span style="width:9px;height:9px;border-radius:50%;background:#ec3013;border:1.5px solid #ffffff;box-shadow:0 0 0 1px #201e1d;display:inline-block"></span>Titik lokasi, bila nomornya disebar karena berdekatan</span>
          </div>
          <p style="font-size:11px;line-height:1.45;color:var(--color-neutral-700);margin:6px 0 0">Peta dasar © kontributor OpenStreetMap. Nomor lokasi yang berdekatan disebar melingkar dan dihubungkan garis ke titik aslinya; perbesar peta untuk melihatnya terpisah. Zoom dengan tombol + / − atau scroll setelah mengklik peta; di ponsel cubit dengan dua jari. Posisi titik indikatif.</p>
        </div>

        <div>
          <div class="kk-kpi">
            <div style="border:2px solid var(--color-divider);padding:12px">
              <div class="kk-kpi-v" style="font-size:22px;font-weight:800;font-family:var(--font-heading);color:var(--color-accent-700);overflow-wrap:break-word">48.536 ha</div>
              <div style="font-size:11px;color:var(--color-neutral-700);margin-top:4px;line-height:1.35">Luas karhutla per September (BNPB), terluas nasional; total 2025: 26.703 ha</div>
            </div>
            <div style="border:2px solid var(--color-divider);padding:12px">
              <div class="kk-kpi-v" style="font-size:22px;font-weight:800;font-family:var(--font-heading);color:var(--color-accent-700);overflow-wrap:break-word">287 hari</div>
              <div style="font-size:11px;color:var(--color-neutral-700);margin-top:4px;line-height:1.35">Siaga darurat bencana asap, 2 Feb–15 Nov; delapan kabupaten ikut menetapkan</div>
            </div>
            <div style="border:2px solid var(--color-divider);padding:12px">
              <div class="kk-kpi-v" style="font-size:22px;font-weight:800;font-family:var(--font-heading);color:var(--color-accent-700);overflow-wrap:break-word">5,24%</div>
              <div style="font-size:11px;color:var(--color-neutral-700);margin-top:4px;line-height:1.35">Pertumbuhan TW III-2026, turun dari 6,14% di TW I (nasional 5,47%)</div>
            </div>
            <div style="border:2px solid var(--color-divider);padding:12px">
              <div class="kk-kpi-v" style="font-size:22px;font-weight:800;font-family:var(--font-heading);color:var(--color-accent-700);overflow-wrap:break-word">±650 MW</div>
              <div style="font-size:11px;color:var(--color-neutral-700);margin-top:4px;line-height:1.35">Beban puncak sistem Khatulistiwa; padam bergilir Juli dan Oktober 2026</div>
            </div>

const END = Date.UTC(2026, 10, 28, 1, 40, 0); // 28 Nov 2026 08.40 WIB, take off pulang

function wibNow() {
  const now = Date.now();
  const d = new Date(now + 7 * 3600000);
  return { ms: now, y: d.getUTCFullYear(), m: d.getUTCMonth(), day: d.getUTCDate() };
}

function initialState() {
  const w = wibNow();
  const during = w.y === 2026 && w.m === 10 && w.day >= 24 && w.day <= 28;
  return { tema: "semua", activeDay: during ? w.day - 24 : 0, isuOpen: { karhutla: true }, sasOpen: {}, teamDay: (during && w.day === 25) ? 1 : 0 };
}

function pad(n) { return n < 10 ? "0" + n : String(n); }

class Component extends DCLogic {
  state = initialState();

  componentDidMount() {
    this._tick = setInterval(() => this.forceUpdate(), 60000);
  }

  componentWillUnmount() {
    clearInterval(this._tick);
    clearTimeout(this._mapWait);
    if (this._map) { this._map.remove(); this._map = null; }
  }

  setMapEl(el) {
    this._mapEl = el;
    if (el) this.initMap();
  }

  initMap() {
    if (this._map || !this._mapEl) return;
    const L = window.L;
    if (!L) { clearTimeout(this._mapWait); this._mapWait = setTimeout(() => this.initMap(), 200); return; }
    const map = L.map(this._mapEl, { scrollWheelZoom: false, zoomControl: true, dragging: !L.Browser.mobile, tap: false });
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; <a href=\"https://www.openstreetmap.org/copyright\">OpenStreetMap</a> contributors"
    }).addTo(map);
    this._spider = L.layerGroup().addTo(map);
    this._pins = LOKASI.map((l) => {
      const latlng = L.latLng(l.lat, l.lon);
      const icon = L.divIcon({ className: "kk-pin", html: String(l.no), iconSize: [24, 24], iconAnchor: [12, 12], popupAnchor: [0, -12] });
      const marker = L.marker(latlng, { icon, title: l.nama, keyboard: true }).addTo(map);
      marker.bindPopup("<strong>" + l.no + ". " + l.nama + "</strong><br>" + l.waktu + "<br><span style=\"color:#605d5d\">" + l.ket + "</span>");
      return { no: l.no, latlng, marker };
    });
    map.fitBounds(this._pins.map((o) => o.latlng), { padding: [44, 44] });
    map.on("click focus", () => map.scrollWheelZoom.enable());
    map.on("mouseout blur", () => map.scrollWheelZoom.disable());
    map.on("zoomend", () => this.layoutPins());
    this._map = map;
    this.layoutPins();
    setTimeout(() => { map.invalidateSize(); this.layoutPins(); }, 300);
  }

  layoutPins() {
    // Each place keeps a small red dot at its own position. Numbers that would cover each other
    // are spread on a ring around their shared centre, with a thin line back to their own dot.
    const map = this._map, L = window.L;
    if (!map || !L || !this._pins) return;
    const GAP = 30;
    this._spider.clearLayers();
    const items = this._pins.map((o) => ({ o, p: map.latLngToLayerPoint(o.latlng) }));
    const seen = new Set();
    const groups = [];
    items.forEach((it, i) => {
      if (seen.has(i)) return;
      const g = [i]; seen.add(i);
      for (let k = 0; k < g.length; k++) {
        items.forEach((other, j) => {
          if (!seen.has(j) && items[g[k]].p.distanceTo(other.p) < GAP) { g.push(j); seen.add(j); }
        });
      }
      groups.push(g.map((idx) => items[idx]));
    });
    groups.forEach((g) => {
      if (g.length === 1) { g[0].o.marker.setLatLng(g[0].o.latlng); return; }
      const c = g.reduce((acc, it) => acc.add(it.p), L.point(0, 0)).divideBy(g.length);
      const r = Math.max(38, (g.length * (GAP + 4)) / (2 * Math.PI));
      const angleOf = (it) => Math.atan2(it.p.y - c.y, it.p.x - c.x);
      g.sort((a, b) => angleOf(a) - angleOf(b));
      const start = angleOf(g[0]);
      g.forEach((it, i) => {
        const ang = start + (i * 2 * Math.PI) / g.length;
        const spot = map.layerPointToLatLng(L.point(c.x + r * Math.cos(ang), c.y + r * Math.sin(ang)));
        it.o.marker.setLatLng(spot);
        L.polyline([it.o.latlng, spot], { color: "#201e1d", weight: 1.5, opacity: 0.7, interactive: false }).addTo(this._spider);
      });
      g.forEach((it) => {
        L.circleMarker(it.o.latlng, { radius: 4, color: "#ffffff", weight: 1.5, fillColor: "#ec3013", fillOpacity: 1, interactive: false }).addTo(this._spider);
      });
    });
  }

  renderVals() {
    const w = wibNow();
    const diffDays = Math.ceil((START - w.ms) / DAY_MS);
    let countdownValue, countdownLabel;
    if (w.ms >= END) { countdownValue = "Selesai"; countdownLabel = "KUNJUNGAN 24–28 NOV TELAH BERAKHIR"; }
    else if (diffDays > 0) { countdownValue = "H-" + diffDays; countdownLabel = "MENUJU KUNJUNGAN"; }
    else { countdownValue = "Hari " + (1 - diffDays) + "/5"; countdownLabel = "KUNJUNGAN BERLANGSUNG"; }

    const ORD = ["Pertama", "Kedua", "Ketiga", "Keempat", "Kelima"];
    let dayBannerTitle, dayBannerSub;
    if (w.ms >= END) { dayBannerTitle = "KEGIATAN SELESAI"; dayBannerSub = "KKDN Kalbar 24–28 November 2026 telah berakhir"; }
    else if (diffDays > 0) { dayBannerTitle = "H-" + diffDays; dayBannerSub = "menuju Hari Pertama · Selasa, 24 November 2026"; }
    else {
      const idx = Math.min(4, -diffDays);
      const dd = DAYS[idx];
      dayBannerTitle = "HARI " + ORD[idx].toUpperCase();
      dayBannerSub = dd.dow + ", " + dd.date + " November 2026";
    }

    const MONTHS = ["J", "F", "M", "A", "M", "J", "J", "A", "S", "O", "N", "D"];
    const monthLabels = MONTHS.map((lab, i) => ({
      label: lab,
      style: "left:" + (4.17 + i * 8.333).toFixed(2) + "%;top:46px;transform:translateX(-50%);font-weight:600;font-size:9.5px"
    }));

    const tabBase = "text-align:left;padding:10px 14px;min-height:44px;border:2px solid var(--color-text);font-family:var(--font-heading);font-weight:800;font-size:12.5px;cursor:pointer;";
    const tabs = TEMA.map((tm) => {
      const on = this.state.tema === tm.id;
      const n = tm.id === "semua" ? SASARAN.length : SASARAN.filter((s) => s.tema === tm.id).length;
      return {
        label: tm.label, count: n + " SASARAN", pressed: on,
        style: tabBase + (on ? "background:var(--color-text);color:var(--color-bg)" : "background:var(--color-bg);color:var(--color-text)"),
        pick: () => this.setState({ tema: tm.id })
      };
    });

    const TIM_STYLE = {
      A: ["TIM A", "background:#201e1d;color:#f3f2f2"],
      B: ["TIM B", "background:#ff9783;color:#201e1d"],
      G: ["TIM GABUNGAN", "background:#d7d3d3;color:#201e1d"]
    };
    const sasOpen = this.state.sasOpen || {};
    const activeSasaran = SASARAN
      .filter((s) => this.state.tema === "semua" || s.tema === this.state.tema)
      .map((s) => ({
        ...s,
        noLabel: pad(s.no),
        profil: FILES[s.no],
        open: !!sasOpen[s.no],
        icon: sasOpen[s.no] ? "−" : "+",
        toggle: () => this.setState((st) => ({ sasOpen: { ...(st.sasOpen || {}), [s.no]: !(st.sasOpen || {})[s.no] } })),
        timLabel: TIM_STYLE[s.tim][0],
        tagStyle: "font-size:10px;font-weight:800;letter-spacing:.04em;padding:3px 7px;white-space:nowrap;" + TIM_STYLE[s.tim][1]
      }));

    const isuOpen = this.state.isuOpen || {};
    const isu = ISU.map((x) => ({
      judul: x.judul,
      poin: x.poin,
      open: !!isuOpen[x.id],
      icon: isuOpen[x.id] ? "−" : "+",
      tag: x.rel.length + " SASARAN",
      tagStyle: "flex:0 0 auto;font-size:10.5px;font-weight:800;letter-spacing:.04em;padding:3px 7px;white-space:nowrap;" +
        (x.utama ? "background:#dd2b0f;color:#ffffff" : "background:#d7d3d3;color:#201e1d"),
      boxStyle: "align-self:start;border:2px solid " + (x.utama ? "var(--color-text)" : "var(--color-divider)"),
      rel: x.rel.slice().sort((a, b) => a - b).map((n) => ({ label: pad(n) + " " + SHORT[n], file: FILES[n] })),
      toggle: () => this.setState((st) => ({ isuOpen: { ...(st.isuOpen || {}), [x.id]: !(st.isuOpen || {})[x.id] } }))
    }));

    const days = DAYS.map((d, i) => {
      const active = this.state.activeDay === i;
      return {
        dow: "Hari " + ORD[i] + " · " + d.dow, dateLabel: d.dateLabel, summary: d.summary, stay: d.stay, hasStay: !!d.stay,
        active, icon: active ? "−" : "+",
        toggle: () => this.setState((s) => ({ activeDay: s.activeDay === i ? null : i })),
        boxStyle: "border:2px solid " + (active ? "var(--color-text)" : "var(--color-divider)") + ";background:" + (active ? "var(--color-neutral-100)" : "transparent"),
        items: d.items.map((it) => ({
          time: it.time, text: it.text, note: it.note, hasNote: !!it.note,
          isHead: it.kind === "head", isRow: it.kind !== "head",
          style: it.kind === "key"
            ? "font-size:12.5px;line-height:1.45;padding-left:10px;border-left:3px solid var(--color-accent);font-weight:600"
            : "font-size:12px;line-height:1.45;padding-left:11px;border-left:2px solid var(--color-neutral-300);color:var(--color-neutral-800)"
        }))
      };
    });

    const firstDow = new Date(Date.UTC(2026, 10, 1)).getUTCDay();
    const cells = [];
    for (let i = 0; i < firstDow; i++) cells.push(null);
    for (let d = 1; d <= 30; d++) cells.push(d);
    while (cells.length % 7 !== 0) cells.push(null);
    const today = (w.y === 2026 && w.m === 10) ? w.day : null;
    const calendarCells = cells.map((num) => {
      const isEvent = num !== null && num >= 24 && num <= 28;
      const isSel = isEvent && (num - 24) === this.state.activeDay;
      const isToday = num !== null && num === today;
      let bg = "transparent", color = "var(--color-text)";
      if (isEvent) bg = "var(--color-neutral-300)";
      if (isSel) { bg = "#ec3013"; color = "#ffffff"; }
      if (isToday && !isSel) { bg = "#f5860b"; color = "#201e1d"; }
      return {
        num: num || "",
        style: "aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:11px;background:" + bg + ";color:" + color + ";font-weight:" + (isEvent || isToday ? "800" : "400")
      };
    });

    const teamTabs = TEAMS.map((td, i) => {
      const on = this.state.teamDay === i;
      return {
        label: td.label, pressed: on,
        style: "padding:8px 12px;min-height:44px;border:2px solid var(--color-text);font-weight:800;font-size:12px;cursor:pointer;" + (on ? "background:var(--color-text);color:var(--color-bg)" : "background:var(--color-bg);color:var(--color-text)"),
        pick: () => this.setState({ teamDay: i })
      };
    });
    const activeTeams = TEAMS[this.state.teamDay || 0].teams;

    if (!this._mapRef) this._mapRef = (el) => this.setMapEl(el);

    return {
      mapRef: this._mapRef, dayBannerTitle, dayBannerSub, countdownValue, countdownLabel, monthLabels,
      tabs, activeSasaran, isu, days, calendarCells, teamTabs, activeTeams,
      weekdayLabels: ["Min", "Sen", "Sel", "Rab", "Kam", "Jum", "Sab"]
    };
  }
}
mountDC(Component, document.getElementById("tpl"), document.getElementById("app"));
</script>
</body>
</html>
